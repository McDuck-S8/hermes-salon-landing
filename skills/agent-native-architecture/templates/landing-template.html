<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NICHE_TITLE}} — {{OFFER}}</title}}</title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 80px 20px; text-align: center; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; font-weight: 800; }
        .hero .hook { font-size: 1.3rem; opacity: 0.9; margin-bottom: 2rem; }
        .cta-btn { display: inline-block; background: #ff6b35; color: white; padding: 18px 40px; border-radius: 50px; font-size: 1.1rem; font-weight: 700; text-decoration: none; transition: transform 0.2s; }
        .cta-btn:hover { transform: scale(1.05); }
        .benefits { padding: 60px 20px; max-width: 1000px; margin: 0 auto; }
        .benefits h2 { text-align: center; font-size: 2rem; margin-bottom: 3rem; }
        .benefits-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; }
        .benefit-card { background: #f8f9fa; padding: 2rem; border-radius: 16px; text-align: center; }
        .benefit-card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
        .social-proof { background: #f8f9fa; padding: 60px 20px; }
        .social-proof h2 { text-align: center; font-size: 2rem; margin-bottom: 3rem; }
        .testimonials { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; max-width: 1000px; margin: 0 auto; }
        .testimonial { background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .stars { color: #ffc107; margin-bottom: 1rem; }
        .cta-section { background: #1a1a1a; color: white; padding: 60px 20px; text-align: center; }
        .cta-section h2 { font-size: 2rem; margin-bottom: 1rem; }
        .cta-section p { margin-bottom: 2rem; opacity: 0.8; }
        .trust { display: flex; justify-content: center; gap: 2rem; margin-top: 2rem; opacity: 0.7; font-size: 0.9rem; }
        @media (max-width: 768px) { .hero h1 { font-size: 2rem; } .hero .hook { font-size: 1.1rem; } }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hook">{{HOOK}}</div>
        <h1>{{HEADLINE}}</h1>
        <p>{{SUBHEADLINE}}</p>
        <a href="{{CTA_URL}}" class="cta-btn">{{CTA_TEXT}}</a>
        <p style="margin-top: 1rem; font-size: 0.9rem; opacity: 0.8;">{{URGENCY_TEXT}}</p>
    </section>
    
    <section class="benefits">
        <h2>{{BENEFITS_HEADLINE}}</h2>
        <div class="benefits-grid">
            {{BENEFIT_CARDS}}
        </div>
    </section>
    
    <section class="social-proof">
        <h2>{{SOCIAL_PROOF_HEADLINE}}</h2>
        <div class="testimonials">
            {{TESTIMONIALS}}
        </div>
    </section>
    
    <section class="cta-section">
        <h2>{{FINAL_CTA_HEADLINE}}</h2>
        <p>{{FINAL_CTA_SUBTEXT}}</p>
        <a href="{{CTA_URL}}" class="cta-btn">{{CTA_TEXT}}</a>
        <div class="trust">
            {{TRUST_SIGNALS}}
        </div>
    </section>
    
    <!-- Tracking pixels go here -->
    <script>
        // Meta Pixel / GA4 / TikTok Pixel initialization
        console.log('Landing loaded - tracking initialized');
    </script>
</body>
</html>
