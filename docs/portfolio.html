<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редизайн сайта: Fargo — салон краси на Позняках</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#111;color:#e0e0e0;display:flex;flex-direction:column}
header{text-align:center;padding:22px 20px 16px;border-bottom:1px solid #222}
header h1{font-size:22px;font-weight:600;letter-spacing:-.3px;color:#eee}
header p{font-size:13px;color:#777;margin-top:4px;max-width:460px;margin-left:auto;margin-right:auto}
.viewport{flex:1;display:flex;min-height:0;position:relative}
.panel{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.panel-left{border-right:1px solid #222}
.panel-header{position:relative;z-index:2;padding:10px 18px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;flex-shrink:0;background:#18181a;border-bottom:1px solid #2a2a2d}
.panel-header span{color:#aaa;font-weight:400;font-size:12px}
.panel-header strong{color:#e0e0e0;font-weight:600}
iframe{flex:1;width:100%;border:none;background:#fff;box-shadow:inset 0 2px 8px rgba(0,0,0,.06)}
.divider{position:absolute;top:0;bottom:0;left:50%;width:6px;transform:translateX(-3px);z-index:10;cursor:col-resize;background:transparent}
.divider-line{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);background:#333;transition:background .15s}
.divider:hover .divider-line,.divider.active .divider-line{background:#555}
.divider-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:32px;height:32px;background:#222;border:2px solid #444;border-radius:100px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s}
.divider:hover .divider-handle,.divider.active .divider-handle{border-color:#666;background:#2a2a2a}
.divider-handle::before,.divider-handle::after{content:'';display:block;width:1px;height:14px;background:#555;margin:0 3px}
.divider-handle::before{margin-right:3px}
.divider-handle::after{margin-left:3px}
footer{padding:16px 20px;text-align:center;border-top:1px solid #222;flex-shrink:0}
footer a{display:inline-flex;align-items:center;gap:7px;padding:11px 30px;background:#2c2c2e;color:#e0e0e0;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;transition:background .15s;border:1px solid #3a3a3d}
footer a:hover{background:#3a3a3c;border-color:#555}
footer .hint{display:block;color:#555;font-size:11px;margin-top:6px}

@media(max-width:768px){
header h1{font-size:17px}
.viewport{flex-direction:column}
.panel-left{border-right:none;border-bottom:1px solid #222}
.panel{min-height:40vh}
.divider{display:none}
}
</style>
</head>
<body>

<header>
<h1>Редизайн сайта: Fargo — салон краси на Позняках</h1>
<p>Обновили дизайн и сделали сайт удобным для записи клиентов</p>
</header>

<div class="viewport">
<div class="panel panel-left">
<div class="panel-header">
<strong>Текущий сайт</strong>
<span>— версия, с которой работали</span>
</div>
<iframe id="leftFrame" src="current-site.html" loading="lazy"></iframe>
</div>

<div class="divider" id="divider" title="Изменить пропорцию">
<div class="divider-line"></div>
<div class="divider-handle"></div>
</div>

<div class="panel panel-right">
<div class="panel-header">
<strong>Обновлённая версия</strong>
<span>— результат после редизайна</span>
</div>
<iframe id="rightFrame" src="fargo/" loading="lazy"></iframe>
</div>
</div>

<footer>
<a href="https://t.me/hermes_studio" target="_blank">✏️ Обсудить проект</a>
<span class="hint">Синхронный скролл: прокрутите любую панель — вторая повторит</span>
</footer>

<script>
(function(){
/* sync scroll */
let syncing = false;
const lf = document.getElementById('leftFrame');
const rf = document.getElementById('rightFrame');
let lw = null, rw = null;

function getWin(f){ try{ return f.contentWindow }catch(e){ return null } }

function setupSync(){
lw = getWin(lf); rw = getWin(rf);
if(!lw || !rw || !lw.document.body || !rw.document.body) return;

const sync = (src, tgt) => {
src.addEventListener('scroll', () => {
if(syncing) return; syncing = true;
const se = src.document.scrollingElement || src.document.documentElement;
const te = tgt.document.scrollingElement || tgt.document.documentElement;
te.scrollTop = (se.scrollTop / (se.scrollHeight - se.clientHeight)) * (te.scrollHeight - te.clientHeight);
requestAnimationFrame(() => { syncing = false; });
}, {passive: true});
};
sync(lw, rw); sync(rw, lw);
}

let loaded = 0;
function onLoad(){ if(++loaded === 2) setupSync(); }
lf.addEventListener('load', onLoad);
rf.addEventListener('load', onLoad);

let tries = 0;
const iv = setInterval(() => {
tries++;
if(lw && rw){ clearInterval(iv); return; }
lw = getWin(lf); rw = getWin(rf);
if(lw && rw && lw.document.body && rw.document.body){ setupSync(); clearInterval(iv); }
if(tries > 30) clearInterval(iv);
}, 300);

/* divider drag */
(function(){
const div = document.getElementById('divider');
const vp = document.querySelector('.viewport');
const panels = vp.querySelectorAll('.panel');
let dragging = false;

div.addEventListener('mousedown', (e) => {
dragging = true; div.classList.add('active');
document.body.style.cursor = 'col-resize';
document.body.style.userSelect = 'none';
e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
if(!dragging) return;
const rect = vp.getBoundingClientRect();
let pct = (e.clientX - rect.left) / rect.width;
pct = Math.max(0.15, Math.min(0.85, pct));
panels[0].style.flex = pct;
panels[1].style.flex = 1 - pct;
});

document.addEventListener('mouseup', () => {
if(!dragging) return;
dragging = false; div.classList.remove('active');
document.body.style.cursor = '';
document.body.style.userSelect = '';
});
})();
})();
</script>

</body>
</html>
