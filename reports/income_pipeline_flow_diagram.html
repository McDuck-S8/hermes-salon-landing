            border-bottom: 2px solid #1e2329;
            text-align: center;

            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            gap: 10px;
        }
        
        .item-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .item-label {
            flex: 1;
            font-size: 0.85rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .item-count {
            font-size: 0.7rem;
            color: #5c6570;
        }
        
        /* Arrows Layout */
        .arrows {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: -1;
        }
        
        .arrow {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #2d3748;
            transform-origin: left center;
        }
        
        .arrow.highlighted {
            background: #3b7dd4;
            height: 3px;
            box-shadow: 0 0 8px #3b7dd4;
        }
        
        /* Legend Styles */
        .legend-source, .legend-proxy, .legend-offer, .legend-withdrawal {
            border: 2px solid;
            border-radius: 4px;
            padding: 2px 6px;
            margin-right: 4px;

            background: rgba(255,255,255,0.05);
        }
        
        /* Responsive Design */
        @media (max-width: 1100px) {
            .column {
                width: 200px;
            }
            
            .sources { left: 0; }
            .proxies { left: 200px; }
            .offers { left: 400px; }
            .withdrawal { left: 600px; }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .column {
                position: static;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 2px solid #1e2329;
                margin-bottom: 20px;
            }
            
            .sources, .proxies, .offers, .withdrawal {
                left: 0;
            }
            
            .arrows {
                display: none;
            }
            
            .stats {
                grid-template-columns: 1fr;

        /* Scrollbar */

            width: 8px;
        }

            background: #1e2329;
        }

            background: #484f58;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #5c6570;
        }
    </style>

        // Create arrow path between two points
        function createArrowPath(x1, y1, x2, y2, color) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const midX = (x1 + x2) / 2;
            const controlY1 = y1 + 40;
            const controlY2 = y2 - 40;
            
            const d = `M${x1},${y1} C${midX},${controlY1} ${midX},${controlY2} ${x2},${y2}`;
            
            path.setAttribute('d', d);
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-dasharray', '5,5');
            path.classList.add('arrow');
            
            return path;
        }

            const proxiesColumn = document.createElement('div');
            proxiesColumn.className = 'column proxies';
            proxiesColumn.innerHTML = '<div class="column-header">⚙️ PROXIES (5 groups)</div>';
            
            Object.keys(proxyGroups).sort().forEach(proxy => {
                const items = proxyGroups[proxy];
                const itemElement = document.createElement('div');
                itemElement.className = 'proxy-item';
                
                const dot = document.createElement('div');
                dot.className = 'item-dot';
                dot.style.backgroundColor = getStatusColor(items[0].status);
                
                const label = document.createElement('div');
                label.className = 'item-label';
                label.textContent = proxy;
                
                const count = document.createElement('div');
                count.className = 'item-count';
                count.textContent = `×${items.length}`;
                
                itemElement.appendChild(dot);
                itemElement.appendChild(label);
                itemElement.appendChild(count);
                
                proxiesColumn.appendChild(itemElement);
            });
            
            diagram.appendChild(proxiesColumn);
            
            // Create offers column
            const offersColumn = document.createElement('div');
            offersColumn.className = 'column offers';
            offersColumn.innerHTML = '<div class="column-header">💰 OFFERS (14 groups)</div>';
            
            Object.keys(offerGroups).sort().forEach(offer => {
                const items = offerGroups[offer];
                const itemElement = document.createElement('div');
                itemElement.className = 'offer-item';
                
                const dot = document.createElement('div');
                dot.className = 'item-dot';
                dot.style.backgroundColor = getStatusColor(items[0].status);
                
                const label = document.createElement('div');
                label.className = 'item-label';
                label.textContent = offer;
                
                const count = document.createElement('div');
                count.className = 'item-count';
                count.textContent = `×${items.length}`;
                
                itemElement.appendChild(dot);
                itemElement.appendChild(label);
                itemElement.appendChild(count);
                
                offersColumn.appendChild(itemElement);
            });
            
            diagram.appendChild(offersColumn);
            
            // Create withdrawal column
            const withdrawalColumn = document.createElement('div');
            withdrawalColumn.className = 'column withdrawal';
            withdrawalColumn.innerHTML = '<div class="column-header">💸 WITHDRAWAL (4 groups)</div>';
            
            Object.keys(withdrawalGroups).sort().forEach(withdrawal => {
                const items = withdrawalGroups[withdrawal];
                const itemElement = document.createElement('div');
                itemElement.className = 'withdrawal-item';
                
                const dot = document.createElement('div');
                dot.className = 'item-dot';
                dot.style.backgroundColor = getStatusColor(items[0].status);
                
                const label = document.createElement('div');
                label.className = 'item-label';
                label.textContent = withdrawal;
                
                const count = document.createElement('div');
                count.className = 'item-count';
                count.textContent = `×${items.length}`;
                
                itemElement.appendChild(dot);
                itemElement.appendChild(label);
                itemElement.appendChild(count);
                
                withdrawalColumn.appendChild(itemElement);
            });
            
            diagram.appendChild(withdrawalColumn);
            
            // Draw arrows
            drawArrows(diagram);
        }

        // Draw connection arrows
        function drawArrows(container) {
            const arrowsDiv = document.createElement('div');
            arrowsDiv.className = 'arrows';
            
            // Create SVG for arrows
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', '100%');
            svg.setAttribute('height', '100%');
            svg.setAttribute('viewBox', '0 0 1600 600');
            
            // Draw arrows for each scheme
            DATA.forEach(item => {
                const sourceY = getSourceY(item.source);
                const proxyY = getProxyY(item.proxy);
                const offerY = getOfferY(item.offer);
                const withdrawalY = getWithdrawalY(item.withdrawal);
                
                const sourceX = 150;
                const proxyX = 450;
                const offerX = 750;
                const withdrawalX = 1050;
                
                // Source -> Proxy arrow
                const sourcePath = createArrowPath(sourceX, sourceY, proxyX, proxyY, getStatusColor(item.status));
                svg.appendChild(sourcePath);
                
                // Proxy -> Offer arrow
                const proxyPath = createArrowPath(proxyX, proxyY, offerX, offerY, getStatusColor(item.status));
                svg.appendChild(proxyPath);
                
                // Offer -> Withdrawal arrow
                const offerPath = createArrowPath(offerX, offerY, withdrawalX, withdrawalY, getStatusColor(item.status));
                svg.appendChild(offerPath);
            });
            
            arrowsDiv.appendChild(svg);
            container.appendChild(arrowsDiv);
        }

        // Initialize diagram
        window.addEventListener('load', renderDiagram);
    </script>
</body>
</html>
