body{font-family:system-ui,-apple-system,sans-serif;background:#0d0d1a;color:#e0e0e0;margin:20px;font-size:14px}
h1{font-size:18px;margin-bottom:4px}
h1 span{color:#60a5fa}
.sub{color:#666;font-size:12px;margin-bottom:16px}

.summary{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.summary div{background:#111128;border:1px solid #1e1e3a;border-radius:6px;padding:6px 14px;font-size:12px}
.summary .num{font-size:18px;font-weight:700;display:block}
.summary .label{color:#888;font-size:10px;text-transform:uppercase}
.summary .green .num{color:#4ade80}
.summary .yellow .num{color:#facc15}
.summary .red .num{color:#f87171}

.filters{margin-bottom:14px;display:flex;gap:8px;align-items:center}
.filters select{background:#1a1a30;border:1px solid #2a2a4a;color:#e0e0e0;padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer}
.filters select:focus{border-color:#60a5fa;outline:none}
.filters label{color:#888;font-size:12px}
.filters .hint{color:#555;font-size:11px;margin-left:auto}

table{width:100%;border-collapse:collapse;background:#111128;border-radius:8px;overflow:hidden}
th{background:#1a1a30;color:#888;font-size:11px;text-transform:uppercase;letter-spacing:1px;padding:10px 12px;text-align:left;border-bottom:1px solid #2a2a4a}
td{padding:10px 12px;border-bottom:1px solid #1a1a2a;font-size:13px;vertical-align:middle}

tr{cursor:pointer;transition:background 0.1s}
tr.ready td:first-child{border-left:3px solid #4ade80}
tr.testing td:first-child{border-left:3px solid #facc15}
tr.blocked td:first-child{border-left:3px solid #f87171}
tr.untested td:first-child{border-left:3px solid #555}
tr:hover{background:#1a1a30!important}
tr.ready:hover{background:#065f4620!important}
tr.testing:hover{background:#854d0e20!important}
tr.blocked:hover{background:#7f1d1d20!important}

.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag.ready{background:#065f46;color:#4ade80}
.tag.testing{background:#854d0e;color:#facc15}
.tag.blocked{background:#7f1d1d;color:#f87171}
.tag.untested{background:#2a2a4a;color:#888}

.roi{font-weight:700;font-size:14px}
.roi.high{color:#4ade80}
.roi.mid{color:#facc15}
.roi.low{color:#f87171}

.payout{color:#60a5fa;font-size:12px}
.blocker{color:#f87171;font-size:11px}
.cost{color:#888;font-size:11px}

/* ===== MODAL ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
.modal{background:#0d0d1a;border:1px solid #2a2a4a;border-radius:10px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.6)}
.modal h2{font-size:16px;margin-bottom:4px}
.modal .close{float:right;cursor:pointer;color:#555;font-size:20px;line-height:1}
.modal .close:hover{color:#f87171}
.modal .section{margin:12px 0;padding:10px 14px;background:#111128;border-radius:6px;border:1px solid #1e1e3a}
.modal .section h3{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.modal .row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.modal .row .key{color:#888}
.modal .row .val{color:#e0e0e0;font-weight:500}
.modal .row .val.good{color:#4ade80}
.modal .row .val.warn{color:#facc15}
.modal .row .val.bad{color:#f87171}
.modal .steps{margin:6px 0}
.modal .step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:#aaa}
.modal .step .num{background:#1a1a30;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888;flex-shrink:0}
.modal .action-btn{display:inline-block;background:#3b82f6;color:#fff;border:none;padding:8px 20px;border-radius:6px;font-size:13px;cursor:pointer;margin-top:8px;font-weight:600;text-decoration:none}
.modal .action-btn:hover{background:#2563eb}
.modal .action-btn.secondary{background:#1a1a30;color:#888}

@media(max-width:700px){td,th{padding:6px 8px;font-size:12px}.modal{padding:16px;max-width:95%}}

// ================================================================
// RENDER
// ================================================================

function renderTable(list) {
  var tbody = document.querySelector('#routes tbody');
  tbody.innerHTML = '';
  list.forEach(function(r){
    var tr = document.createElement('tr');
    tr.className = r.status;
    tr.onclick = function(){ openModal(r); };
    tr.innerHTML =
      '<td>'+r.src+'<br><span class="payout">'+r.srcDetail+'</span></td>'+
      '<td>'+r.proxy+'<br><span class="payout">'+r.proxyDetail+'</span></td>'+
      '<td>'+r.offer+'<br><span class="payout">'+r.offerDetail+'</span></td>'+
      '<td>'+r.pay+'<br><span class="payout">'+r.payDetail+'</span></td>'+
      '<td>'+r.exit+'<br><span class="payout">'+r.exitDetail+'</span></td>'+
      '<td><span class="roi '+r.roiClass+'">'+r.roi+'</span></td>'+
      '<td><span class="tag '+r.status+'">'+r.statusLabel+'</span></td>';
    tbody.appendChild(tr);
  });
}
renderTable(routes);

// ================================================================
// FILTER
// ================================================================

function filterTable() {
  var val = document.getElementById('filter').value;
  if(val === 'all') { renderTable(routes); return; }
  var filtered = routes.filter(function(r){ return r.status === val; });
  renderTable(filtered);
}

function openModal(r) {
  document.getElementById('mTitle').textContent = r.src + ' → ' + r.offer;
  document.getElementById('mRoute').textContent = r.proxy + ' → ' + r.pay + ' → ' + r.exit;

  var html = '';

  // Status + ROI
  html += '<div class="section"><h3>Статус</h3>';
  html += '<div class="row"><span class="key">Статус</span><span class="val '+r.status+'">'+r.statusLabel+'</span></div>';
  html += '<div class="row"><span class="key">ROI</span><span class="val '+r.roiClass+'">'+r.roi+'</span></div>';
  html += '<div class="row"><span class="key">Прогноз/день</span><span class="val good">'+r.daily+'</span></div>';
  html += '<div class="row"><span class="key">Бюджет</span><span class="val">'+r.budget+'</span></div>';
  if(r.conf) html += '<div class="row"><span class="key">Confidence</span><span class="val">'+r.conf+'</span></div>';
  if(r.math) html += '<div class="row"><span class="key">Математика</span><span class="val" style="font-size:11px;color:#888;text-align:right;max-width:350px">'+r.math+'</span></div>';
  html += '</div>';

  // Steps
  html += '<div class="section"><h3>Пошаговый план</h3><div class="steps">';
  r.steps.forEach(function(s,i){
    html += '<div class="step"><span class="num">'+(i+1)+'</span>'+s+'</div>';
  });
  html += '</div></div>';

  // Blockers
  if(r.blockers && r.blockers.length) {
    html += '<div class="section" style="border-color:#7f1d1d"><h3 style="color:#f87171">⛔ Блокеры</h3>';
    r.blockers.forEach(function(b){
      html += '<div class="row"><span class="key" style="color:#f87171">✕</span><span class="val" style="color:#f87171">'+b+'</span></div>';
    });
    html += '</div>';
  }

  // Next action
  html += '<div style="text-align:center;margin-top:14px">';
  html += '<div class="action-btn" onclick="closeModal()">🎯 '+r.next+'</div>';
  html += '</div>';

  document.getElementById('mContent').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}

// ESC key
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});
</script>

</body>
</html>
