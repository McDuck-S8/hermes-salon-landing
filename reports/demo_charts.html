<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Charts</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --code-bg: #1c2128;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 2rem;
  max-width: 900px;
  margin: 0 auto;
}
h1 { font-size: 2rem; margin: 1.5rem 0 0.5rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
h2 { font-size: 1.5rem; margin: 1.5rem 0 0.5rem; color: var(--text); }
h3 { font-size: 1.2rem; margin: 1rem 0 0.5rem; color: var(--yellow); }
p { margin: 0.5rem 0; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
strong { color: var(--text); }
em { color: var(--muted); }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 1rem 0;
  font-size: 0.9rem;
}
th, td {
  padding: 0.6rem 1rem;
  border: 1px solid var(--border);
  text-align: left;
}
th {
  background: var(--surface);
  color: var(--accent);
  font-weight: 600;
}
tr:nth-child(even) { background: var(--surface); }
tr:hover { background: rgba(88, 166, 255, 0.05); }
code {
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  background: var(--code-bg);
  padding: 0.15rem 0.4rem;
  border-radius: 4px;
  font-size: 0.85em;
  color: var(--yellow);
}
pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem;
  margin: 1rem 0;
  overflow-x: auto;
  font-size: 0.85rem;
  line-height: 1.5;
}
pre code {
  background: none;
  padding: 0;
  color: var(--text);
}
ul, ol { margin: 0.5rem 0 0.5rem 1.5rem; }
li { margin: 0.25rem 0; }
blockquote {
  border-left: 3px solid var(--accent);
  padding: 0.5rem 1rem;
  margin: 1rem 0;
  background: var(--surface);
  border-radius: 0 6px 6px 0;
  color: var(--muted);
}
.stats {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin: 1rem 0;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.5rem;
  text-align: center;
  min-width: 120px;
}
.stat-value {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent);
}
.stat-label {
  font-size: 0.8rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tag {
  display: inline-block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.15rem 0.6rem;
  font-size: 0.75rem;
  color: var(--muted);
  margin: 0.1rem;
}
.emoji { font-size: 1.2em; }
@media (max-width: 600px) {
  body { padding: 1rem; }
  .stats { flex-direction: column; }
}
</style>
</head>
<body>
<h1>Демо: Графики и Круги Эйлера</h1>

<p>Проверка всех возможностей md2html.py</p>

<h2>Столбчатая диаграмма (bar)</h2>

<div style="max-width:600px;margin:1rem auto;">
  <canvas id="chart_1"></canvas>
</div>
<script>
new Chart(document.getElementById('chart_1'), {
  type: 'bar',
  data: {
    labels: ["Actionable", "Blocked", "Ready to launch", "Needs research"],
    datasets: [{
      label: 'Key distribution',
      data: [96.0, 25.0, 25.0, 10.0],
      backgroundColor: ['#58a6ff', '#3fb950', '#d29922', '#f85149'],
      borderColor: ['#58a6ff', '#3fb950', '#d29922', '#f85149'],
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    plugins: { legend: { labels: { color: '#8b949e' } } },
    scales: {
      x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
      y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
    }
  }
});
</script>

<h2>Круговая диаграмма (pie)</h2>

<div style="max-width:600px;margin:1rem auto;">
  <canvas id="chart_2"></canvas>
</div>
<script>
new Chart(document.getElementById('chart_2'), {
  type: 'pie',
  data: {
    labels: ["Knowledge Filter", "RSS/YouTube", "Research"],
    datasets: [{
      label: 'Sources',
      data: [48.0, 60.0, 50.0],
      backgroundColor: ['#58a6ff', '#3fb950', '#d29922'],
      borderColor: ['#58a6ff', '#3fb950', '#d29922'],
      borderWidth: 1
    }]
  },
  options: {
    responsive: true,
    plugins: { legend: { labels: { color: '#8b949e' } } },
    scales: {
      x: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } },
      y: { ticks: { color: '#8b949e' }, grid: { color: '#30363d' } }
    }
  }
});
</script>
