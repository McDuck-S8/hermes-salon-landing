[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crimea-sec-v2"
version = "2.0.0"
description = "Legal penetration testing framework for Crimea/Russia - based on T3MP3ST and HexStrike AI"
readme = "README.md"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Crimea Security Framework Team", email = "security@crimea-sec.local"}
]
keywords = [
    "penetration-testing",
    "red-teaming",
    "bug-bounty",
    "security-audit",
    "crimea",
    "russia",
    "compliance",
    "152-fz",
    "187-fz",
    "gost-57580",
    "mcp",
    "ai-agents"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "aiofiles>=23.2",
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "dnspython>=2.4",
    "cryptography>=42.0",
    "asyncio-throttle>=1.0",
    "tenacity>=8.2",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
full = [
    "aiosqlite>=0.19",
    "asyncpg>=0.29",
    "redis>=5.0",
    "elasticsearch>=8.11",
    "weasyprint>=60.0",
    "wkhtmltopdf>=0.2",
]

[project.scripts]
crimea-sec = "src.cli.main:cli"
crimea-sec-mcp = "src.mcp.server:main"

[project.urls]
Homepage = "https://github.com/hermes/crimea-sec-v2"
Repository = "https://github.com/hermes/crimea-sec-v2"
Issues = "https://github.com/hermes/crimea-sec-v2/issues"
Documentation = "https://github.com/hermes/crimea-sec-v2/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crimea_sec*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "PIE", "PTH", "ERA", "PL", "TRY", "ARG", "NPY", "RSE", "PERF", "RET", "ASYNC", "LOG", "Q"]
ignore = ["S101", "S106", "S311", "S603", "S607"]
per-file-ignores = { "scripts/*" = ["S603", "S607"], "tests/*" = ["S101"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "src/cli/*", "src/mcp/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]